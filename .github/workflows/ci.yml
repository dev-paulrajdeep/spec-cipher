name: CI

on:
  push:
    branches:
      - main
      - "Architectural_*"
      - "feature/*"
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-contracts:
    name: Lint & Architecture Contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Ruff Lint
        run: ruff check .

      - name: Run Ruff Format Check
        run: ruff format --check .

      - name: Run Import Linter Contracts
        run: lint-imports

      - name: Run Architecture Contract Tests
        run: pytest tests/test_architecture_contracts.py -v

  test:
    name: Test Suite (Unit & Contract)
    runs-on: ubuntu-latest
    needs: lint-and-contracts
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Fast Unit & Contract Tests
        run: |
          pytest tests/ -v -m "not gpu and not e2e" --disable-warnings -p no:cacheprovider --cov=speccipher --cov-report=xml --cov-report=term

      - name: Upload Coverage to Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: ignore
